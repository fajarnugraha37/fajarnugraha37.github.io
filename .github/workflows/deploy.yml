name: Deploy to Github Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.next/cache
            ${{ github.workspace }}/.cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build with Next.js
        run: bun run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_URL: https://nugrahafajar.my.id
          NEXT_PUBLIC_APP_MODE: read
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          ENABLE_PRODUCTION_BROWSER_SOURCEMAPS: "false"

      - name: Inspect export artifact
        run: |
          set -euo pipefail

          if [ ! -d "./out" ]; then
            echo "ERROR: ./out directory not found"
            exit 1
          fi

          FILE_COUNT=$(find ./out -type f | wc -l | tr -d ' ')
          TOTAL_BYTES=$(find ./out -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          TOTAL_MB=$(awk "BEGIN {printf \"%.2f\", ${TOTAL_BYTES}/1024/1024}")

          echo "Export file count: ${FILE_COUNT}"
          echo "Export total bytes: ${TOTAL_BYTES}"
          echo "Export total MB: ${TOTAL_MB}"
          echo "Largest exported files:"
          find ./out -type f -printf '%s\t%p\n' > /tmp/out-files.tsv
          sort -nr /tmp/out-files.tsv | awk 'NR <= 20 { print }'

          echo "Top-level out/ directories:"
          du -sh ./out/* 2>/dev/null | sort -hr || true

      - name: Audit series budget
        run: bun run check:series-budget
        env:
          SERIES_TOTAL_BUDGET_MB: ${{ vars.SERIES_TOTAL_BUDGET_MB }}
          SERIES_HTML_TOTAL_BUDGET_MB: ${{ vars.SERIES_HTML_TOTAL_BUDGET_MB }}
          SERIES_LARGEST_PAGE_BUDGET_KB: ${{ vars.SERIES_LARGEST_PAGE_BUDGET_KB }}
          SERIES_LARGEST_SERIES_BUDGET_MB: ${{ vars.SERIES_LARGEST_SERIES_BUDGET_MB }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
